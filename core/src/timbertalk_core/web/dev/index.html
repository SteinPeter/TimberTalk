<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TimberTalk Werkbank</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="kopf">
      <div class="kopf-titel">
        <strong>TimberTalk Werkbank</strong>
        <span class="kopf-hinweis">
          Entwickler-Oberfläche – ein Client der REST-API, wie die spätere App.
        </span>
      </div>

      <!--
        Kopfleiste: diese Werte gehen als Kopfzeilen bei jedem Aufruf mit und
        liegen im localStorage. Der Akteur-Typ entscheidet, ob Bestätigen erlaubt ist.
      -->
      <form class="zugang" id="zugang" autocomplete="off">
        <label>
          API-Schlüssel
          <input id="z-api-key" type="password" size="14" placeholder="X-API-Key" />
        </label>
        <label>
          Akteur-ID
          <input id="z-actor" size="30" placeholder="UUID (X-Actor)" />
        </label>
        <button type="button" id="z-actor-neu" title="Neue UUID erzeugen">neu</button>
        <label>
          Akteur-Typ
          <select id="z-actor-type">
            <option value="user">user (Mensch)</option>
            <option value="agent">agent (KI)</option>
            <option value="system">system</option>
          </select>
        </label>
        <label>
          Quelle
          <select id="z-source"></select>
        </label>
        <label>
          Korrelations-ID
          <input id="z-correlation" size="30" placeholder="leer = je Aufruf neu" />
        </label>
        <span class="zugang-stand" id="z-stand">nicht geprüft</span>
      </form>
    </header>

    <nav class="reiter" id="reiter"></nav>
    <main id="inhalt"><p class="laedt">Werkbank wird geladen …</p></main>
    <div class="meldungen" id="meldungen"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
