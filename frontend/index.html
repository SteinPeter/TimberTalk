<!doctype html>
<!-- Die einzige Seite von TimberTalk – nur das Gerüst: oben die Reiterleiste, darunter <main>.
     Reiter und Bereiche trägt app.js aus der Liste in reiter.js ein. Was ein Reiter zeigt,
     steht in seiner eigenen Datei unter features/<id>/<id>.js. -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TimberTalk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <!-- Logo und Schriftzug führen zur Startseite (dort steht kein eigener Reiter „Start“). -->
      <a class="brand" href="#start" aria-label="TimberTalk – Startseite">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <!-- Ein einfaches Dach aus zwei Sparren über einem Balken. -->
          <path d="M4 17 16 6l12 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <rect x="7" y="20" width="18" height="4" rx="1" fill="currentColor" />
        </svg>
        <span>TimberTalk</span>
      </a>
      <nav class="tabs" aria-label="Bereiche"></nav>
    </header>

    <main></main>

    <script type="module" src="app.js"></script>
  </body>
</html>
